<!DOCTYPE html>
<html>
<head> 
  <style>
      #container {
        width: 400px;
        padding: 20px;
        border: 2px solid black;
        display: flex;
        gap: 10px;
        flex-wrap: wrap; 
      }

      #container button {
        width: 100px;
        height: 60px;
        font-size: 20px;
      }

      #display {
        width: 100%;
        min-height: 50px;
        border: 1px solid gray;
        margin-top: 10px;
      }
    </style>
  </style>
</head>
<body>
  <div id="container">
    <div id="display"></div>
    <button id="resetButton" class="operateButton">clear</button>
    <button id="addButton" class="operateButton">+</button>
    <button id="subtractButtton" class="operateButton">-</button>
    <button id="multipplyButton" class="operateButton">*</button>
    <button id="devideButton" class="operateButton">/</button>
    <button id="equalButton" class="operateButton">=</button>
    <button id="zeroButton" class="digitButton">0</button>
    <button id="oneButton" class="digitButton">1</button>
    <button id="twoButton" class="digitButton">2</button>
    <button id="threeButton" class="digitButton">3</button>
    <button id="fourButton" class="digitButton">4</button>
    <button id="fiveButton" class="digitButton">5</button>
    <button id="sixButton" class="digitButton">6</button>
    <button id="sevenButton" class="digitButton">7</button>
    <button id="eightButton" class="digitButton">8</button>
    <button id="nineButton" class="digitButton">9</button>
    <script src="calculator.js"></script>
  </div>
</body>
</html>
